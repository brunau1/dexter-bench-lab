# The SUT, its dependencies, simulators and the seed job.
# Rules (checked by bench run): no `ports`, no `network_mode`, no networks other than the default,
# no `cpus`/`mem_limit`/`cpuset`/`deploy.resources` (the kit sets them from target.yaml), an explicit
# `image:` on every built service, and no service named k6, sink, prometheus or cadvisor.
# Add healthchecks to long-running services so the kit can wait for readiness.
services:
  api:
    image: ${APP_IMAGE:-my-app:latest}  # variants override APP_IMAGE
    environment:
      DB_URL: mongodb://db:27017/app
      CACHE_URL: redis://cache:6379
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 2s
      retries: 30

  db:
    image: mongo:8.0.32
    volumes: [db-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 30

  cache:
    image: redis:8.8.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  seed:
    image: my-system-seed:local       # built services need an explicit image tag: bench prepare builds it once
    build: ./seed
    profiles: [seed]                  # only started by the kit, once per repetition
    environment:
      DB_URL: mongodb://db:27017/app
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
